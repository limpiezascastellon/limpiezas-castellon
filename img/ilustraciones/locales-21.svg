<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Fachada de un local comercial con escaparate y toldo">
  <defs>
    <linearGradient id="lc-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FBFD"/>
      <stop offset="1" stop-color="#E6F0F8"/>
    </linearGradient>
    <linearGradient id="lc-vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFE6F8"/>
      <stop offset="1" stop-color="#EAF5FD"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#lc-fondo)"/>

  <!-- Fachada -->
  <rect x="150" y="40" width="900" height="480" rx="10" fill="#FFFFFF"/>
  <rect x="150" y="40" width="900" height="54" fill="#EDF4FA"/>

  <!-- Rótulo -->
  <rect x="330" y="104" width="540" height="72" rx="14" fill="#0A3A6E"/>
  <g fill="#FFFFFF" opacity=".92">
    <rect x="382" y="130" width="188" height="14" rx="7"/>
    <rect x="382" y="154" width="120" height="10" rx="5" opacity=".7"/>
    <path d="M760 128h44a10 10 0 0 1 10 10v22a10 10 0 0 1-10 10h-44a10 10 0 0 1-10-10v-22a10 10 0 0 1 10-10z" opacity=".22"/>
    <path d="M770 128v-6a12 12 0 0 1 24 0v6" fill="none" stroke="#FFFFFF" stroke-width="5" opacity=".8"/>
  </g>

  <!-- Toldo -->
  <path d="M206 196h788l34 74H172z" fill="#16C2B0"/>
  <g fill="#FFFFFF" opacity=".9">
    <path d="M320 196h78l-34 74h-78z"/>
    <path d="M512 196h78l-34 74h-78z"/>
    <path d="M704 196h78l-34 74h-78z"/>
    <path d="M896 196h78l-34 74h-78z"/>
  </g>
  <path d="M172 270h856v18a10 10 0 0 1-10 10H182a10 10 0 0 1-10-10z" fill="#0E9C8E"/>

  <!-- Escaparate -->
  <rect x="222" y="320" width="452" height="200" rx="8" fill="#0A3A6E"/>
  <rect x="234" y="332" width="428" height="176" rx="4" fill="url(#lc-vidrio)"/>
  <g opacity=".55" fill="#FFFFFF">
    <path d="M280 332l-46 176h40l46-176z"/>
    <path d="M360 332l-46 176h20l46-176z"/>
  </g>
  <!-- Expositor del escaparate -->
  <g>
    <rect x="470" y="404" width="170" height="14" rx="6" fill="#9FC3E2"/>
    <rect x="486" y="356" width="46" height="48" rx="6" fill="#0E5AA7"/>
    <rect x="546" y="370" width="38" height="34" rx="6" fill="#F4B740"/>
    <rect x="596" y="362" width="34" height="42" rx="6" fill="#16C2B0"/>
    <rect x="470" y="470" width="170" height="12" rx="6" fill="#9FC3E2"/>
  </g>

  <!-- Puerta -->
  <rect x="728" y="300" width="212" height="220" rx="8" fill="#0A3A6E"/>
  <rect x="740" y="312" width="188" height="196" rx="4" fill="url(#lc-vidrio)"/>
  <rect x="826" y="380" width="14" height="60" rx="7" fill="#9FB6C7"/>
  <!-- Cartel de abierto -->
  <g>
    <rect x="770" y="340" width="104" height="34" rx="10" fill="#16C2B0"/>
    <rect x="786" y="352" width="72" height="10" rx="5" fill="#FFFFFF" opacity=".92"/>
  </g>

  <!-- Planta junto a la entrada -->
  <g transform="translate(966 396)">
    <path d="M36 4c26 10 38 34 34 62-26-2-42-22-34-62z" fill="#3FA97A"/>
    <path d="M36 14C14 26 6 50 14 76 38 70 48 48 36 14z" fill="#2E8F66"/>
    <path d="M6 70h64l-8 54H14z" fill="#E6EDF4"/>
    <rect x="0" y="58" width="76" height="18" rx="9" fill="#D2DEE9"/>
  </g>

  <!-- Acera -->
  <rect x="0" y="520" width="1200" height="80" fill="#DDE8F1"/>
  <rect x="0" y="520" width="1200" height="10" fill="#C9D9E6"/>
  <g stroke="#C9D9E6" stroke-width="6" opacity=".8">
    <path d="M200 556h180M440 556h180M680 556h180M920 556h140"/>
  </g>
</svg>
