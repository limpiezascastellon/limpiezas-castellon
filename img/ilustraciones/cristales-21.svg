<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ventanal siendo limpiado con una limpiacristales">
  <defs>
    <linearGradient id="cr-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6FAFD"/>
      <stop offset="1" stop-color="#E7F0F8"/>
    </linearGradient>
    <linearGradient id="cr-cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDFF8"/>
      <stop offset="1" stop-color="#EAF6FE"/>
    </linearGradient>
    <clipPath id="cr-vidrio">
      <rect x="152" y="66" width="896" height="452" rx="6"/>
    </clipPath>
  </defs>

  <rect width="1200" height="600" fill="url(#cr-fondo)"/>

  <!-- Hueco del ventanal -->
  <rect x="140" y="54" width="920" height="476" rx="12" fill="#0A3A6E"/>
  <rect x="152" y="66" width="896" height="452" rx="6" fill="url(#cr-cielo)"/>

  <g clip-path="url(#cr-vidrio)">
    <!-- Paisaje detrás del cristal -->
    <circle cx="880" cy="160" r="52" fill="#F4B740" opacity=".55"/>
    <g fill="#FFFFFF" opacity=".8">
      <ellipse cx="330" cy="150" rx="74" ry="30"/>
      <ellipse cx="386" cy="136" rx="52" ry="26"/>
      <ellipse cx="700" cy="230" rx="60" ry="24"/>
    </g>
    <g fill="#9EC6E8" opacity=".55">
      <rect x="180" y="330" width="120" height="190"/>
      <rect x="330" y="290" width="90" height="230"/>
      <rect x="760" y="310" width="140" height="210"/>
      <rect x="930" y="360" width="100" height="160"/>
    </g>
    <rect x="152" y="470" width="896" height="50" fill="#8FBEE3" opacity=".45"/>

    <!-- Mitad todavía sucia, con la marca de agua del paso anterior -->
    <path d="M152 66h430l-90 452H152z" fill="#9AA9B4" opacity=".3"/>
    <path d="M582 66l-90 452h34l90-452z" fill="#FFFFFF" opacity=".55"/>

    <!-- Espuma -->
    <g fill="#FFFFFF" opacity=".8">
      <circle cx="250" cy="190" r="26"/>
      <circle cx="318" cy="248" r="16"/>
      <circle cx="222" cy="300" r="20"/>
      <circle cx="300" cy="372" r="13"/>
      <circle cx="210" cy="420" r="17"/>
      <circle cx="380" cy="330" r="11"/>
    </g>

    <!-- Rastro limpio de la goma -->
    <path d="M596 66l-90 452" stroke="#FFFFFF" stroke-width="30" opacity=".5" stroke-linecap="round"/>
  </g>

  <!-- Travesaños -->
  <g fill="#0A3A6E">
    <rect x="586" y="66" width="18" height="452"/>
    <rect x="152" y="284" width="896" height="18"/>
  </g>

  <!-- Limpiacristales -->
  <g transform="rotate(-18 640 300)">
    <rect x="556" y="286" width="172" height="26" rx="13" fill="#16C2B0"/>
    <rect x="556" y="306" width="172" height="14" rx="7" fill="#0E9C8E"/>
    <rect x="626" y="248" width="32" height="46" rx="10" fill="#C9D9E6"/>
    <rect x="612" y="186" width="60" height="70" rx="26" fill="#F4B740"/>
    <rect x="628" y="116" width="28" height="82" rx="14" fill="#B7C8D6"/>
  </g>

  <!-- Repisa y pulverizador -->
  <rect x="112" y="530" width="976" height="22" rx="8" fill="#D7E3EE"/>
  <rect x="112" y="552" width="976" height="10" rx="5" fill="#C6D6E4"/>
  <g transform="translate(940 430)">
    <path d="M18 34h72v82a14 14 0 0 1-14 14H32a14 14 0 0 1-14-14z" fill="#16C2B0"/>
    <rect x="34" y="14" width="40" height="24" rx="6" fill="#0E9C8E"/>
    <path d="M34 22H6l-6-16h24z" fill="#0A3A6E"/>
    <rect x="30" y="58" width="48" height="34" rx="6" fill="#FFFFFF" opacity=".75"/>
  </g>
</svg>
